<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Marée Marina del Rey</title>
<meta name="description" content="Boats, tours, car rental, catering and more around Marina del Rey. Ask for a quote and chat with local companies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/shared.css">
<style>
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.app.full{padding-bottom:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
@media (min-width:700px){ .app{margin-top:24px;margin-bottom:24px;border-radius:32px;min-height:calc(100dvh - 48px);overflow:hidden;box-shadow:0 30px 60px -40px rgba(0,0,0,.35)} .app.full{height:calc(100dvh - 48px)} }
.top{padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{font-size:26px}
.hello p{color:var(--muted);font-size:14.5px;margin-top:2px}
.top-acts{display:flex;gap:8px}
.langbtn{height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:700;font-size:13px}
.langbtn svg{width:18px;height:18px}
.searchbar{margin-top:18px;display:flex;align-items:center;gap:10px;height:54px;border:1px solid var(--line);border-radius:999px;padding:0 18px;background:var(--bg)}
.searchbar:focus-within{border-color:var(--ink)}
.searchbar input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px}
.searchbar svg{width:20px;height:20px;flex:none}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:18px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/1.05;display:block;max-width:100%}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 58%)}
.cat .lbl{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff}
.cat .lbl b{display:block;font-size:17px;line-height:1.2;letter-spacing:-.01em}
.cat .lbl small{font-size:12.5px;opacity:.9}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-right:20px}
.hscroll::-webkit-scrollbar{display:none}
.ocard{flex:none;width:240px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.ocard.full{width:auto}
.ocard .ph{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.ocard h3{font-size:16px;line-height:1.25}
.ocard .meta{font-size:13px;color:var(--muted)}
.ocard .row2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ocard .price{font-weight:700;font-size:14px;white-space:nowrap}
.vlist{display:flex;flex-direction:column;gap:24px}
.steps3{display:grid;gap:10px}
.steps3 div{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:600;font-size:14.5px}
.steps3 span{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.nav .bar{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:999px;padding:6px}
.nav a{position:relative;height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;padding:0 16px;font-weight:700;font-size:14.5px}
.nav a svg{width:21px;height:21px}
.nav a[aria-current="page"]{background:#fff;color:var(--ink)}
.nav .badge{border-color:var(--ink);top:2px;right:4px}

/* welcome */
.welcome{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.welcome{min-height:calc(100dvh - 48px)}}
.w-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.wordmark{font-weight:700;letter-spacing:.06em;font-size:18px;display:flex;align-items:flex-start;gap:2px}
.wordmark i{width:7px;height:7px;border:1.5px solid var(--ink);border-radius:50%;margin-top:1px}
.orbit-wrap{position:relative;width:min(330px,84vw);aspect-ratio:1;margin:26px 0 22px}
.halo{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle,#fff 55%,#F3F3F4 56%,#fff 72%);box-shadow:0 0 0 1px #F0F0F1}
.orb{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 10px 22px -10px rgba(0,0,0,.4);animation:drift 10s ease-in-out infinite alternate}
.center{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border-radius:26px;overflow:hidden;box-shadow:0 16px 36px -14px rgba(0,0,0,.4);animation:breathe 12s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(-1.5deg)}50%{transform:translate3d(3px,-7px,0) rotate(.5deg)}100%{transform:translate3d(-3px,4px,0) rotate(1.5deg)}}
@keyframes breathe{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-52%) scale(1.02)}}
.welcome .kicker{color:var(--faint);font-size:14px;text-align:center}
.welcome h1{font-size:clamp(28px,7.6vw,34px);font-weight:500;text-align:center;line-height:1.18;margin-top:10px;max-width:16ch;letter-spacing:-.025em}
.welcome .cta{margin-top:auto;width:100%;padding-top:30px}

/* listing */
.bar-h{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-top:calc(14px + env(safe-area-inset-top,0px));gap:8px}
.bar-h h1{font-size:17px;text-align:center}
.hero{position:relative;height:340px;overflow:hidden}
.hero .hb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;z-index:2}
.hero .hb svg{width:20px;height:20px}
.dsheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:22px;padding-bottom:120px}
.dtitle h1{font-size:24px;line-height:1.2}
.from{font-size:15px;color:var(--muted);margin-top:4px}
.from b{color:var(--ink);font-size:18px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.gal button{aspect-ratio:1;border-radius:14px;overflow:hidden;border:0;padding:0;position:relative}
.gal button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.h3{font-size:16px;margin-top:22px;margin-bottom:10px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.desc{font-size:15px;color:var(--ink-2);line-height:1.6;margin-top:12px}
.bookbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.bookbar{bottom:24px;border-radius:0 0 32px 32px}}
.bookbar small{display:block;color:var(--muted);font-size:12.5px}

/* quote form */
.progress{height:4px;background:var(--soft-2);border-radius:2px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .3s}
.qhead{margin-top:18px}
.qhead .note{font-weight:600}
.qhead h2{font-size:24px;margin-top:4px}
.qopt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:14px}
.qopt .th{width:54px;height:54px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.qopt b{font-size:15px}
.qform{display:flex;flex-direction:column;gap:20px;margin-top:20px;padding-bottom:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.stepper{height:52px;border:1px solid var(--line);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;max-width:220px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:20px;display:grid;place-items:center}
.stepper b{font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qfoot{display:flex;gap:10px;padding-top:6px}
.qfoot .btn{flex:1}

/* messages list */
.tlist{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.titem{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:22px;padding:10px;position:relative}
.titem .th{width:64px;height:64px;border-radius:16px;overflow:hidden;position:relative;flex:none}
.titem .tx{flex:1;min-width:0}
.titem .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tx .last{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tx .last.unread{color:var(--ink);font-weight:700}
.titem .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--heart)}
.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:22px;color:var(--muted);margin-top:18px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.langlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.langlist button{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;font-size:15.5px}
.langlist button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chatwrap{flex:1;min-height:0}
.chat-h .bk{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.chat-h .bk svg{width:18px;height:18px}
.chat-h{padding-top:calc(12px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script src="/i18n.js"></script>
<script src="/catalog.js"></script>
<script src="/shared.js"></script>
<script>
(() => {
"use strict";
const { CATS, OPTIONS, FIELDS, WELCOME } = window.MAREE_CATALOG;
const { esc, money, store, img, toast, api, Live, connBanner, Chat, makeT } = window.M;
const LANGS = window.MAREE_I18N.LANGS;
const app = document.getElementById("app"), layer = document.getElementById("layer");
const optById = Object.fromEntries(OPTIONS.map((o) => [o.id, o]));
const catById = Object.fromEntries(CATS.map((c) => [c.id, c]));

const I = {
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  back: window.M.ICON.back,
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
};

/* ---------- state ---------- */
const params = new URLSearchParams(location.search);
if (params.get("g")) { store.set("maree-gt", params.get("g")); store.set("maree-welcomed", true); history.replaceState(null, "", location.pathname + location.hash); }
const guessLang = () => { const n = (navigator.language || "en").slice(0, 2); return LANGS.includes(n) ? n : "en"; };
const S = {
  lang: store.get("maree-lang", guessLang()),
  token: store.get("maree-gt", ""),
  threads: [], cat: null, q: "", gal: 0,
  form: null, contact: store.get("maree-contact", { name: "", email: "", phone: "" }),
  live: null, chat: null
};
let t = makeT(S.lang);
document.documentElement.lang = S.lang;
let CTR = null; // translated catalog strings
const tx = (o, k, i) => (CTR && CTR[o.id + "." + k + (i !== undefined ? "." + i : "")]) || (i !== undefined ? o[k][i] : o[k]);
async function loadCatalogLang() {
  CTR = null;
  if (S.lang === "en") return;
  const want = S.lang;
  try { const r = await api("/api/catalog?lang=" + want); if (S.lang === want && r.strings) { CTR = r.strings; route(true); } } catch {}
}
const unitText = (o) => t("unit_" + o.unit);
const fromText = (o) => t("from", { price: money(o.from) });

function startLive() {
  if (S.live || !S.token) return;
  S.live = new Live({ guestToken: S.token });
  connBanner(S.live, t);
  S.live.on("thread", (ev) => {
    const i = S.threads.findIndex((x) => x.id === ev.thread.id);
    if (i >= 0) S.threads[i] = ev.thread; else S.threads.unshift(ev.thread);
    if (current === "messages") viewMessages(); else updateBadge();
  });
  S.live.on("ready", loadThreads);
}
async function loadThreads() {
  if (!S.token) return;
  try { const r = await api("/api/threads", { auth: { guestToken: S.token } }); S.threads = r.threads; if (current === "messages") viewMessages(); else updateBadge(); } catch {}
}
const unreadTotal = () => S.threads.reduce((s, x) => s + (x.unread || 0), 0);
function updateBadge() { const b = document.querySelector("[data-badge]"); if (b) { const n = unreadTotal(); b.hidden = !n; b.textContent = n; } }

/* ---------- shared bits ---------- */
function nav(active) {
  const n = unreadTotal();
  return `<nav class="nav" aria-label="Main"><div class="bar">
    <a href="#home" ${active === "home" ? 'aria-current="page"' : ""}>${I.home}<span>${esc(t("home"))}</span></a>
    <a href="#messages" ${active === "messages" ? 'aria-current="page"' : ""}>${I.chat}<span>${esc(t("messages"))}</span><span class="badge" data-badge ${n ? "" : "hidden"}>${n}</span></a>
  </div></nav>`;
}
const langBtn = () => `<button class="langbtn" type="button" data-lang-open aria-label="${esc(t("language"))}">${I.globe}<span>${S.lang.toUpperCase()}</span></button>`;
function ocard(o, full) {
  return `<a class="ocard${full ? " full" : ""}" href="#opt-${o.id}">
    <div class="ph ph-fallback">${img(o.photos[0].src, full ? 760 : 520)}</div>
    <div class="row2"><h3>${esc(tx(o, "title"))}</h3></div>
    <div class="meta"><span class="price">${esc(fromText(o))}</span> · ${esc(unitText(o))}</div></a>`;
}
function langSheet() {
  layer.innerHTML = `<div class="scrim" data-close><div class="sheet pad" role="dialog" aria-modal="true" aria-labelledby="lg-t">
    <div class="grab"></div><h2 id="lg-t" style="font-size:19px">${esc(t("language"))}</h2>
    <div class="langlist">${LANGS.map((l) => `<button type="button" data-lang="${l}" aria-pressed="${l === S.lang}"><span>${esc(window.MAREE_I18N.I18N[l].lang_name)}</span>${l === S.lang ? I.check : ""}</button>`).join("")}</div>
  </div></div>`;
}
function setLang(l) {
  S.lang = l; store.set("maree-lang", l); t = makeT(l); document.documentElement.lang = l;
  layer.innerHTML = ""; route(true); loadCatalogLang();
  if (S.form) S.form.lang = l;
}

/* ---------- views ---------- */
function viewWelcome() {
  app.className = "app";
  const sizes = [56, 48, 62, 44, 54, 60, 46, 58, 42, 52, 50];
  const orbs = WELCOME.orbit.map((p, i) => {
    const a = (i / WELCOME.orbit.length) * Math.PI * 2 - Math.PI / 2, r = 40 + (i % 2 ? 4 : 0), s = sizes[i] / 330 * 100;
    return `<div class="orb ph-fallback" style="width:${s}%;height:${s}%;left:${50 + r * Math.cos(a) - s / 2}%;top:${50 + r * Math.sin(a) - s / 2}%;animation-delay:-${(i * 1.7).toFixed(1)}s;animation-duration:${9 + (i % 4) * 1.6}s">${img(p.src, 180)}</div>`;
  }).join("");
  app.innerHTML = `<div class="welcome pad">
    <div class="w-top"><span style="width:60px"></span><div class="wordmark">MARÉE<i></i></div>${langBtn()}</div>
    <div class="orbit-wrap"><div class="halo"></div>${orbs}<div class="center ph-fallback">${img(WELCOME.center.src, 420, "Marina del Rey harbor")}</div></div>
    <p class="kicker">${esc(t("welcome_kicker"))}</p>
    <h1>${esc(t("welcome_title"))}</h1>
    <div class="cta"><a class="btn btn-ink block" href="#home" data-welcomed>${esc(t("welcome_cta"))}</a></div>
  </div>`;
}

function viewHome() {
  app.className = "app";
  const name = (S.contact.name || "").split(" ")[0];
  const q = S.q.trim().toLowerCase();
  const results = q ? OPTIONS.filter((o) => (tx(o, "title") + " " + tx(o, "blurb") + " " + t("cat_" + o.cat) + " " + o.title + " " + o.blurb).toLowerCase().includes(q)) : [];
  const popular = ["sunset-sail", "convertible", "private-chef", "bike-tour", "private-yacht", "surf-lesson"].map((id) => optById[id]);
  app.innerHTML = `<div class="pad">
    <div class="top">
      <div class="hello"><h1>${esc(name ? t("hey_name", { name }) : t("hey"))}</h1><p>${esc(t("home_sub"))}</p></div>
      <div class="top-acts">${langBtn()}</div>
    </div>
    <label class="searchbar">${I.search}<span class="sr">${esc(t("search"))}</span><input id="q" type="search" value="${esc(S.q)}" placeholder="${esc(t("search"))}" autocomplete="off"></label>
    ${q ? `<section class="sec"><div class="vlist">${results.map((o) => ocard(o, true)).join("") || `<div class="empty">—</div>`}</div></section>` : `
    <section class="sec" aria-labelledby="cats-h">
      <div class="sec-h"><h2 id="cats-h">${esc(t("all_categories"))}</h2></div>
      <div class="cats">${CATS.map((c) => `<a class="cat ph-fallback" href="#cat-${c.id}">${img(c.photo.src, 420)}<span class="lbl"><b>${esc(t("cat_" + c.id))}</b><small>${esc(t("options_n", { n: OPTIONS.filter((o) => o.cat === c.id).length }))}</small></span></a>`).join("")}</div>
    </section>
    <section class="sec" aria-labelledby="pop-h">
      <div class="sec-h"><h2 id="pop-h">${esc(t("popular"))}</h2></div>
      <div class="hscroll">${popular.map((o) => ocard(o)).join("")}</div>
    </section>
    <section class="sec" aria-labelledby="hiw-h">
      <div class="sec-h"><h2 id="hiw-h">${esc(t("how_it_works"))}</h2></div>
      <div class="steps3"><div><span>1</span>${esc(t("hiw_1"))}</div><div><span>2</span>${esc(t("hiw_2"))}</div><div><span>3</span>${esc(t("hiw_3"))}</div></div>
    </section>`}
  </div>${nav("home")}`;
  const qi = document.getElementById("q");
  qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; viewHome(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
}

function viewCat(id) {
  const c = catById[id]; if (!c) return go("home");
  app.className = "app";
  app.innerHTML = `<div class="pad">
    <div class="bar-h"><a class="iconbtn" href="#home" aria-label="${esc(t("back"))}">${I.back}</a><h1>${esc(t("cat_" + c.id))}</h1><span></span></div>
    <section class="sec" style="margin-top:18px"><div class="vlist">${OPTIONS.filter((o) => o.cat === c.id).map((o) => ocard(o, true)).join("")}</div></section>
  </div>${nav("home")}`;
}

function viewOption(id) {
  const o = optById[id]; if (!o) return go("home");
  app.className = "app";
  if (S.galFor !== id) { S.gal = 0; S.galFor = id; }
  const p = o.photos[S.gal] || o.photos[0];
  app.innerHTML = `
  <div class="hero ph-fallback">${img(p.src, 960, tx(o, "title"))}<a class="hb" href="#cat-${o.cat}" aria-label="${esc(t("back"))}">${I.back}</a></div>
  <div class="dsheet pad">
    <p class="note" style="font-weight:700">${esc(t("cat_" + o.cat))}</p>
    <div class="dtitle"><h1>${esc(tx(o, "title"))}</h1></div>
    <p class="from">${esc(t("typical"))}: <b class="num">${esc(fromText(o))}</b> ${esc(unitText(o))}</p>
    <p class="desc">${esc(tx(o, "blurb"))}</p>
    <h2 class="h3">${esc(t("included"))}</h2>
    <div class="facts">${o.incl.map((x, i) => `<span>${I.check}${esc(tx(o, "incl", i))}</span>`).join("")}</div>
    <div class="gal" role="group" aria-label="Photos">${o.photos.map((ph, i) => `<button type="button" class="ph-fallback" data-gal="${i}" aria-pressed="${i === S.gal}" aria-label="Photo ${i + 1}">${img(ph.src, 200)}</button>`).join("")}</div>
    <p class="note" style="margin-top:8px">${esc(t("photo_by", { by: p.by }))}</p>
    <h2 class="h3">${esc(t("how_it_works"))}</h2>
    <div class="steps3"><div><span>1</span>${esc(t("hiw_1"))}</div><div><span>2</span>${esc(t("hiw_2"))}</div><div><span>3</span>${esc(t("hiw_3"))}</div></div>
  </div>
  <div class="bookbar pad"><div><b>${esc(t("request_quote"))}</b><small>${esc(t("free_no_payment"))}</small></div><a class="btn btn-ink" href="#ask-${o.id}">${esc(t("request_quote"))}</a></div>`;
}

/* ---------- quote form (3 steps) ---------- */
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function ensureForm(o) {
  if (!S.form || S.form.optionId !== o.id) {
    const fields = {};
    for (const k of catById[o.cat].fields) { const f = FIELDS[k]; if (f.type === "stepper") fields[k] = f.def; }
    S.form = { optionId: o.id, step: 1, fields, notes: "", ...S.contact, lang: S.lang, err: "" };
  }
  return S.form;
}
function fieldHtml(k, f, v) {
  const L = esc(t("f_" + k));
  if (f.type === "date") return `<div class="f"><label for="fd-${k}">${L}</label><div class="inp"><input id="fd-${k}" type="date" min="${todayIso()}" value="${esc(v || "")}" data-field="${k}"></div></div>`;
  if (f.type === "daterange") return `<div class="f"><span class="l">${L}</span><div class="two">
      <div class="f"><label class="note" for="fd-from">${esc(t("f_from"))}</label><div class="inp"><input id="fd-from" type="date" min="${todayIso()}" value="${esc(v ? v.from : "")}" data-range="from"></div></div>
      <div class="f"><label class="note" for="fd-to">${esc(t("f_to"))}</label><div class="inp"><input id="fd-to" type="date" min="${todayIso()}" value="${esc(v ? v.to : "")}" data-range="to"></div></div></div></div>`;
  if (f.type === "stepper") return `<div class="f"><span class="l" id="lb-${k}">${L}</span><div class="stepper" role="group" aria-labelledby="lb-${k}"><button type="button" data-step="${k}:-1" aria-label="−">−</button><b class="num" aria-live="polite">${v}</b><button type="button" data-step="${k}:1" aria-label="+">+</button></div></div>`;
  if (f.type === "chips") return `<div class="f"><span class="l" id="lb-${k}">${L}</span><div class="chips" role="group" aria-labelledby="lb-${k}">${f.choices.map((c) => `<button type="button" class="chip" data-chip="${k}:${c}" aria-pressed="${v === c}">${esc(t("c_" + c))}</button>`).join("")}</div></div>`;
  return "";
}
function viewAsk(id) {
  const o = optById[id]; if (!o) return go("home");
  app.className = "app";
  const F = ensureForm(o), cat = catById[o.cat], total = 3;
  const s1 = cat.fields.filter((k) => k !== "budget");
  let body = "";
  if (F.step === 1) body = s1.map((k) => fieldHtml(k, FIELDS[k], F.fields[k])).join("");
  if (F.step === 2) body = (cat.fields.includes("budget") ? fieldHtml("budget", FIELDS.budget, F.fields.budget) : "") +
    `<div class="f"><label for="fn">${esc(t("f_notes"))}</label><div class="inp"><textarea id="fn" rows="4" maxlength="2000" placeholder="${esc(t("notes_ph"))}">${esc(F.notes)}</textarea></div></div>`;
  if (F.step === 3) body = `
    <div class="f"><label for="cn">${esc(t("f_name"))}</label><div class="inp"><input id="cn" autocomplete="name" value="${esc(F.name)}" maxlength="80"></div></div>
    <div class="f"><label for="ce">${esc(t("f_email"))}</label><div class="inp"><input id="ce" type="email" autocomplete="email" inputmode="email" value="${esc(F.email)}" maxlength="120"></div></div>
    <div class="f"><label for="cp">${esc(t("f_phone"))} <span class="note">(${esc(t("optional"))})</span></label><div class="inp"><input id="cp" type="tel" autocomplete="tel" value="${esc(F.phone)}" maxlength="30"></div></div>
    <div class="f"><label for="cl">${esc(t("f_lang"))}</label><div class="inp"><select id="cl">${LANGS.map((l) => `<option value="${l}" ${l === F.lang ? "selected" : ""}>${esc(window.MAREE_I18N.I18N[l].lang_name)}</option>`).join("")}</select></div></div>
    <p class="note">${esc(t("contact_note"))}</p>`;
  const titles = { 1: t("s1_title"), 2: t("s2_title"), 3: t("s3_title") };
  app.innerHTML = `<div class="pad">
    <div class="bar-h"><a class="iconbtn" href="#opt-${o.id}" aria-label="${esc(t("back"))}">${I.back}</a><h1>${esc(t("request_quote"))}</h1><span></span></div>
    <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${F.step}"><i style="width:${F.step / total * 100}%"></i></div>
    <div class="qopt"><div class="th ph-fallback">${img(o.photos[0].src, 120)}</div><div><b>${esc(tx(o, "title"))}</b><div class="note">${esc(fromText(o))} · ${esc(unitText(o))}</div></div></div>
    <div class="qhead"><p class="note">${esc(t("step", { n: F.step, total }))}</p><h2>${esc(titles[F.step])}</h2></div>
    <form class="qform" id="qf" novalidate>
      ${body}
      <p class="err" id="qerr" role="alert" ${F.err ? "" : "hidden"}>${esc(F.err)}</p>
      <div class="qfoot">${F.step > 1 ? `<button class="btn btn-line" type="button" data-qback>${esc(t("back"))}</button>` : ""}<button class="btn btn-ink" type="submit" id="qnext">${esc(F.step < total ? t("next") : t("send_request"))}</button></div>
    </form>
  </div>`;
}
function readStep() {
  const F = S.form;
  document.querySelectorAll("[data-field]").forEach((el) => { F.fields[el.dataset.field] = el.value; });
  const fr = document.querySelector("[data-range=from]"), to = document.querySelector("[data-range=to]");
  if (fr) F.fields.dates = { from: fr.value, to: (to && to.value) || fr.value };
  const fn = document.getElementById("fn"); if (fn) F.notes = fn.value;
  const cn = document.getElementById("cn"); if (cn) { F.name = cn.value.trim(); F.email = document.getElementById("ce").value.trim(); F.phone = document.getElementById("cp").value.trim(); F.lang = document.getElementById("cl").value; }
}
async function submitStep() {
  const F = S.form, o = optById[F.optionId];
  readStep(); F.err = "";
  if (F.step === 1) {
    const needDate = catById[o.cat].fields.includes("date") ? !F.fields.date : catById[o.cat].fields.includes("dates") ? !(F.fields.dates && F.fields.dates.from) : false;
    if (needDate) { F.err = t("err_date"); return viewAsk(o.id); }
    F.step = 2; return viewAsk(o.id);
  }
  if (F.step === 2) { F.step = 3; return viewAsk(o.id); }
  if (!F.name) { F.err = t("err_name"); return viewAsk(o.id); }
  if (!F.email && !F.phone) { F.err = t("err_contact"); return viewAsk(o.id); }
  if (F.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(F.email)) { F.err = t("err_email"); return viewAsk(o.id); }
  const btn = document.getElementById("qnext"); btn.disabled = true; btn.textContent = t("sending");
  S.contact = { name: F.name, email: F.email, phone: F.phone }; store.set("maree-contact", S.contact);
  try {
    const r = await api("/api/inquiries", { method: "POST", body: { optionId: o.id, fields: F.fields, notes: F.notes, name: F.name, email: F.email, phone: F.phone, lang: F.lang, guestToken: S.token || undefined } });
    S.token = r.guestToken; store.set("maree-gt", S.token);
    S.threads = [r.thread, ...S.threads.filter((x) => x.id !== r.thread.id)];
    if (F.lang !== S.lang) setLang(F.lang);
    S.form = null;
    startLive();
    toast(t("sent_title"));
    go("t-" + r.thread.id);
  } catch (e) {
    F.err = e.status && e.status < 500 ? e.message : t("err_network");
    viewAsk(o.id);
  }
}

/* ---------- messages ---------- */
function statusPill(s) { return `<span class="pill ${s}">${esc(t("st_" + s))}</span>`; }
function lastLine(x) {
  const m = x.last; if (!m) return "";
  if (m.kind === "system") return "";
  if (m.kind === "quote") return t("quote") + " · " + money(m.data.price, 2);
  const txt = m.lang !== S.lang && m.tr && m.tr[S.lang] ? m.tr[S.lang] : m.body;
  return (m.sender === "guest" ? t("you") + ": " : "") + (txt || (m.kind === "request" ? t("request_details") : ""));
}
function viewMessages() {
  app.className = "app";
  const list = [...S.threads].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  app.innerHTML = `<div class="pad">
    <div class="top"><div class="hello"><h1>${esc(t("messages"))}</h1></div><div class="top-acts">${langBtn()}</div></div>
    ${list.length ? `<div class="tlist">${list.map((x) => { const o = optById[x.optionId] || {}; return `
      <a class="titem" href="#t-${x.id}"><div class="th ph-fallback">${img(x.photo, 140)}</div>
        <div class="tx"><b>${esc(o.id ? tx(o, "title") : x.optionTitle)}</b><div class="note">${esc(x.vendor ? x.vendor.name : t("concierge"))}</div><div class="last ${x.unread ? "unread" : ""}">${esc(lastLine(x))}</div></div>
        <div class="side">${statusPill(x.status)}${x.unread ? `<span class="dot" aria-label="${x.unread} unread"></span>` : ""}</div></a>`; }).join("")}</div>`
    : `<div class="empty"><b>${esc(t("no_messages"))}</b><p style="margin-top:6px">${esc(t("no_messages_body"))}</p><a class="btn btn-ink" style="margin-top:16px" href="#home">${esc(t("start"))}</a></div>`}
  </div>${nav("messages")}`;
}
function viewThread(id) {
  if (!S.token) return go("messages");
  startLive();
  app.className = "app full";
  app.innerHTML = `<div class="chatwrap" id="chatroot"></div>`;
  S.chat = Chat(document.getElementById("chatroot"), {
    role: "guest", lang: S.lang, t, auth: { guestToken: S.token }, live: S.live,
    header: (th) => { const o = optById[th.optionId] || {}; return `<a class="bk" href="#messages" aria-label="${esc(t("back"))}">${I.back}</a>
      <div class="th ph-fallback">${img(th.photo, 100)}</div>
      <div class="ti"><b>${esc(o.id ? tx(o, "title") : th.optionTitle)}</b><span>${esc(th.vendor ? th.vendor.name : t("concierge"))} · ${statusPill(th.status)}</span></div>`; },
    onThread: (th) => { const i = S.threads.findIndex((x) => x.id === th.id); if (i >= 0) S.threads[i] = { ...th, unread: 0 }; }
  });
  S.chat.load(id).catch(() => { toast(t("err_network")); go("messages"); });
}

/* ---------- router ---------- */
let current = "";
function go(h) { location.hash = h; }
function route(keepScroll) {
  const y = scrollY;
  if (S.chat && !location.hash.startsWith("#t-")) { S.chat.destroy(); S.chat = null; }
  let h = location.hash.slice(1);
  if (!h) h = store.get("maree-welcomed", false) ? "home" : "welcome";
  const [name, ...rest] = h.split("-"); const arg = rest.join("-");
  current = name;
  if (name === "welcome") viewWelcome();
  else if (name === "cat") viewCat(arg);
  else if (name === "opt") viewOption(arg);
  else if (name === "ask") viewAsk(arg);
  else if (name === "messages") viewMessages();
  else if (name === "t") { if (keepScroll && S.chat) S.chat.setLang(S.lang, t); else viewThread(Number(arg)); }
  else { current = "home"; viewHome(); }
  if (keepScroll) scrollTo(0, y);
}
window.addEventListener("hashchange", () => { layer.innerHTML = ""; route(); scrollTo(0, 0); });

document.addEventListener("click", (e) => {
  const el = e.target;
  if (el.closest("[data-welcomed]")) store.set("maree-welcomed", true);
  if (el.closest("[data-lang-open]")) { langSheet(); return; }
  const lb = el.closest("[data-lang]"); if (lb) { setLang(lb.dataset.lang); return; }
  if (el.matches("[data-close]")) { layer.innerHTML = ""; return; }
  const g = el.closest("[data-gal]"); if (g) { S.gal = Number(g.dataset.gal); route(true); return; }
  if (S.form && current === "ask") {
    const c = el.closest("[data-chip]"); if (c) { readStep(); const [k, v] = c.dataset.chip.split(":"); S.form.fields[k] = S.form.fields[k] === v ? undefined : v; viewAsk(S.form.optionId); return; }
    const s = el.closest("[data-step]"); if (s) { readStep(); const [k, d] = s.dataset.step.split(":"); const f = FIELDS[k]; S.form.fields[k] = Math.max(f.min, Math.min(f.max, (S.form.fields[k] || f.def) + Number(d))); viewAsk(S.form.optionId); return; }
    if (el.closest("[data-qback]")) { readStep(); S.form.err = ""; S.form.step--; viewAsk(S.form.optionId); return; }
  }
});
document.addEventListener("submit", (e) => { if (e.target.id === "qf") { e.preventDefault(); submitStep(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && layer.innerHTML) layer.innerHTML = ""; });

route();
loadCatalogLang();
if (S.token) { startLive(); loadThreads(); }
})();
</script>
</body>
</html>
