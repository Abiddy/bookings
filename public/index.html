<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Marée Marina del Rey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a phone-first app column on a soft grey ground — white sheets, ink-black pills, 20px-radius photo cards, floating pill nav. Deliberately a single light look, matching the reference. */
:root{
  --ground:#ECEDEF; --bg:#FFFFFF; --soft:#F4F4F5; --ink:#111111; --ink-2:#2A2A2C; --muted:#6E6E73; --faint:#A1A1A6; --line:#E6E6E8;
  --heart:#E5484D; --ok:#1E7A4C; --ok-soft:#E3F3EA; --no:#A23B1A; --no-soft:#FBE9E2;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* app column */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.app.wide{max-width:1120px}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{padding-top:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{font-size:26px}
.hello p{color:var(--muted);font-size:14.5px;margin-top:2px}
.iconbtn{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--heart);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}

/* search + chips */
.searchbar{margin-top:18px;display:flex;align-items:center;gap:10px;height:54px;border:1px solid var(--line);border-radius:999px;padding:0 8px 0 18px;background:var(--bg);width:100%;text-align:left}
.searchbar span{flex:1;color:var(--faint);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbar span.on{color:var(--ink)}
.searchbar svg{width:20px;height:20px;flex:none}
.searchbar .tune{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.on,.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* sections */
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:18px}
.sec-h a,.sec-h button{font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;padding:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-right:20px}
.hscroll::-webkit-scrollbar{display:none}

/* small overlay card (Recently explored style) */
.tile{flex:none;width:200px;height:150px;border-radius:20px;overflow:hidden;position:relative;scroll-snap-align:start;display:block}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 62%)}
.pilltag{position:absolute;top:10px;left:10px;z-index:1;background:#fff;color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.tile .cap{position:absolute;left:0;right:0;bottom:12px;z-index:1;text-align:center;color:#fff}
.tile .cap b{display:block;font-size:19px;letter-spacing:-.02em;line-height:1.15;padding:0 10px}
.tile .cap small{font-size:12px;opacity:.9}

/* big card (Popular hotels style) */
.pcard{flex:none;width:250px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px}
.pcard.full{width:auto}
.ph{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.ph svg{display:block;width:100%;height:100%}
.heart{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;z-index:2}
.heart svg{width:20px;height:20px;color:var(--ink)}
.heart[aria-pressed="true"] svg{color:var(--heart);fill:var(--heart)}
.pcard h3{font-size:16.5px;line-height:1.25}
.pcard .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pcard .price{font-weight:700;white-space:nowrap}
.pcard .price small{font-weight:500;color:var(--muted);font-size:12.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.vlist{display:flex;flex-direction:column;gap:26px}
.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:96px}
.cat svg{width:24px;height:24px}
.cat b{font-size:13.5px;line-height:1.2}

/* floating nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:10px;align-items:center}
.nav .bar{display:flex;align-items:center;gap:2px;background:var(--ink);border-radius:999px;padding:6px}
.nav a{height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;padding:0 12px}
.nav a svg{width:21px;height:21px}
.nav a[aria-current="page"]{background:#fff;color:var(--ink);padding:0 18px;font-weight:700;font-size:14.5px}
.nav a:not([aria-current="page"]) .lbl{display:none}
.nav .fab{width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center}
.nav .fab svg{width:22px;height:22px}

/* welcome */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-top:28px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.wordmark{font-weight:700;letter-spacing:.06em;font-size:18px;display:flex;align-items:flex-start;gap:2px}
.wordmark i{width:7px;height:7px;border:1.5px solid var(--ink);border-radius:50%;margin-top:1px}
.orbit-wrap{position:relative;width:min(330px,86vw);aspect-ratio:1;margin:30px 0 26px}
.halo{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle,#fff 55%,#F3F3F4 56%,#fff 72%);box-shadow:0 0 0 1px #F0F0F1}
.orbit{position:absolute;inset:0;animation:spin 90s linear infinite}
.orb{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);animation:spin 90s linear infinite reverse}
.orb svg{width:100%;height:100%;display:block}
.center{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:26px;overflow:hidden;box-shadow:0 16px 36px -14px rgba(0,0,0,.4)}
.center svg{width:100%;height:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome .kicker{color:var(--faint);font-size:14px}
.welcome h1{font-size:clamp(30px,8vw,36px);font-weight:500;text-align:center;line-height:1.18;margin-top:10px;max-width:15ch;letter-spacing:-.025em}
.welcome .cta{margin-top:auto;width:100%;padding-top:34px}

/* buttons */
.btn{height:56px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;padding:0 26px;gap:8px}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{background:var(--bg);border-color:var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-h{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding-block:6px 10px}
.sheet-h h2{font-size:16px;text-align:center}
.sheet-h button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center}
.sheet .lead h3{font-size:19px}
.sheet .lead p{color:var(--muted);font-size:13.5px;margin-top:2px}
.f{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.f > label,.f > .l{font-weight:700;font-size:14px}
.inp{height:50px;border:1px solid var(--line);border-radius:999px;padding:0 16px;display:flex;align-items:center;gap:10px;background:var(--bg)}
.inp input,.inp select{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;height:100%;appearance:none;-webkit-appearance:none}
.inp svg{width:18px;height:18px;flex:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.step{height:50px;border:1px solid var(--line);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:none;font-size:20px;display:grid;place-items:center}
.step b{font-size:15.5px}
.hist{display:flex;align-items:flex-end;gap:3px;height:60px;padding:0 11px}
.hist i{flex:1;background:#D8D8DB;border-radius:2px 2px 0 0}
.hist i.in{background:var(--ink)}
.dual{position:relative;height:26px}
.dual::before{content:"";position:absolute;left:11px;right:11px;top:12px;height:2px;background:var(--line)}
.dual .sel{position:absolute;top:12px;height:2px;background:var(--ink)}
.dual input{position:absolute;inset:0;width:100%;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:pointer}
.dual input::-webkit-slider-runnable-track{background:none}
.dual input::-moz-range-track{background:none}
.sheet-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}

/* detail */
.hero{position:relative;height:360px;overflow:hidden}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .hb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;z-index:2}
.hero .hb svg{width:20px;height:20px}
.hero .hb.l{left:max(16px,env(safe-area-inset-left,0px))}
.hero .hb.r{right:max(16px,env(safe-area-inset-right,0px))}
.hero .hb[aria-pressed="true"] svg{color:var(--heart);fill:var(--heart)}
.dots{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.75);z-index:2}
.dsheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:22px}
.dtitle{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.dtitle h1{font-size:22px;line-height:1.2}
.dtitle .p{font-size:20px;font-weight:700;white-space:nowrap}
.dtitle .p small{font-size:13px;font-weight:500;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.gal button{aspect-ratio:1;border-radius:12px;overflow:hidden;border:0;padding:0;position:relative;outline-offset:2px}
.gal button svg{width:100%;height:100%;display:block}
.gal button[aria-pressed="true"]{outline:2px solid var(--ink)}
.gal .more{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.h3{font-size:16px;margin-top:24px;margin-bottom:10px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.facts svg{width:15px;height:15px}
.desc{font-size:14.5px;color:var(--ink-2);line-height:1.6}
.desc button{border:0;background:none;padding:0;font-weight:700;color:var(--ink)}
.incl{display:flex;flex-direction:column;gap:12px}
.incl div{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:center;font-size:14px;font-weight:600}
.incl i{display:block;height:4px;border-radius:2px;background:var(--ink)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-right:20px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;height:70px;border-radius:18px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day small{font-size:11.5px;color:var(--muted);font-weight:600}
.day b{font-size:18px}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.day[aria-pressed="true"] small{color:#fff;opacity:.75}
.times{display:flex;gap:8px;flex-wrap:wrap}
.addon{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.addon input{width:20px;height:20px;accent-color:var(--ink);margin:0}
.addon span{flex:1;font-size:14px;font-weight:600}
.meet{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:18px;padding:14px 16px;font-size:14px}
.meet svg{width:20px;height:20px;flex:none;margin-top:1px}
.bookbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--line);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.bookbar b{font-size:18px}
.bookbar small{display:block;color:var(--muted);font-size:12.5px}
.bookbar .btn{height:52px;padding:0 28px}

/* checkout */
.bar-h{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding-top:16px}
.bar-h h1{font-size:17px;text-align:center}
.mini{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:10px}
.mini .th{width:76px;height:76px;border-radius:14px;overflow:hidden;flex:none}
.mini .th svg{width:100%;height:100%;display:block}
.mini b{font-size:15.5px}
.mini div div{font-size:13px;color:var(--muted)}
.pay{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;margin-top:8px}
.pay:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pay input{width:20px;height:20px;accent-color:var(--ink);margin:0}
.pay span{flex:1}
.pay b{display:block;font-size:14.5px}
.pay small{color:var(--muted);font-size:12.5px}
.lines{display:flex;flex-direction:column;gap:8px;font-size:14.5px;margin-top:18px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.note{font-size:12.5px;color:var(--muted)}
.demo{font-size:12.5px;color:var(--ink-2);background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:14px}
.err{color:var(--no);font-size:13px;font-weight:600;margin-top:10px}

/* ticket */
.ticket{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:40px}
.seal{width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.seal svg{width:32px;height:32px}
.ticket h1{font-size:28px}
.stub{width:100%;border:1px solid var(--line);border-radius:24px;text-align:left;margin-top:8px}
.stub .t{padding:12px}
.stub .perf{border-top:2px dashed var(--line);position:relative}
.stub .perf::before,.stub .perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub .perf::before{left:-12px;clip-path:inset(0 0 0 50%)}.stub .perf::after{right:-12px;clip-path:inset(0 50% 0 0)}
.stub dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0;padding:18px}
.stub dt{font-size:11.5px;color:var(--muted);font-weight:600}
.stub dd{margin:2px 0 0;font-weight:700;font-size:14px}
.code{font-size:22px!important;letter-spacing:.14em}

/* plans */
.plan{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:22px;padding:10px}
.plan .th{width:84px;height:84px;border-radius:16px;overflow:hidden;flex:none}
.plan .th svg{width:100%;height:100%;display:block}
.plan .info{flex:1;min-width:0}
.plan h3{font-size:15.5px}
.plan .info div{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:5px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill.sm{background:var(--soft);color:var(--muted)}
.plan .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sbtn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;display:inline-flex;align-items:center}

/* partner desk */
.desk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:22px}
.desk-top h1{font-size:clamp(26px,4vw,34px)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.you{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.you small,.kpi.you span{color:#fff;opacity:.72}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;margin-top:14px;align-items:start}
.card{border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h2{font-size:17px}
.rng{display:flex;flex-direction:column;gap:6px}
.rng header{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.rng output{font-weight:800}
.rng input{width:100%;accent-color:var(--ink)}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:13.5px;font-weight:600}
.bar .tr{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .fl{height:100%;background:var(--ink);border-radius:999px}
.bar b{text-align:right}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right}
tr.cx td:not(:last-child){color:var(--faint);text-decoration:line-through}
td .note{text-decoration:none}
.payouts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.payouts div:last-child{border-bottom:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:50}

@media (min-width:700px){ .app:not(.wide){margin-top:24px;margin-bottom:24px;border-radius:36px;min-height:calc(100vh - 48px);overflow:hidden;box-shadow:0 30px 60px -40px rgba(0,0,0,.35)} }
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .dgrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:420px){ .cats{grid-template-columns:repeat(2,minmax(0,1fr))} .legend,.stub dl{grid-template-columns:minmax(0,1fr)} .bar{grid-template-columns:86px minmax(0,1fr) 64px} .incl div{grid-template-columns:minmax(0,1fr) 70px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/catalog.js"></script>
<script>
(() => {
"use strict";

/* ---------- catalog (sample content to replace with real partners) ---------- */
const { CATS, EXP } = window.MAREE_CATALOG;
const byId = Object.fromEntries(EXP.map(e => [e.id, e]));
const catName = id => (CATS.find(c => c.id === id) || {}).name || id;
const perGroup = e => !["person","bike"].includes(e.unit);

/* ---------- sunset for Marina del Rey (NOAA approximation) ---------- */
function sunsetDate(d){
  const n = Math.floor((d - new Date(d.getFullYear(),0,0))/864e5), g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, la = 33.98*r;
  const ha = Math.acos(Math.cos(90.833*r)/(Math.cos(la)*Math.cos(dec)) - Math.tan(la)*Math.tan(dec))/r;
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) + (720 - 4*(-118.45 - ha) - eq)*6e4);
}
const fmtTime = dt => dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Los_Angeles"});
function slotLabel(slot, day){
  const m = /^sunset-(\d+)$/.exec(slot); if(!m) return slot;
  const t = new Date(sunsetDate(day) - (+m[1])*6e4);
  t.setMinutes(Math.round(t.getMinutes()/15)*15, 0, 0);
  return fmtTime(t);
}

/* ---------- illustrated scenes ---------- */
const SKY = {
  dusk:{a:"#F2C9A6",b:"#E89A7A",sun:"#D9583A",sea:"#1C4E63",wave:"#E8B49A",far:"#7E6A79"},
  day:{a:"#BFDDE3",b:"#E6F0EC",sun:"#F2C46B",sea:"#2A6E80",wave:"#BFE0E3",far:"#8FAFB4"},
  morning:{a:"#E7E1D3",b:"#F3EFE4",sun:"#E9A05B",sea:"#3A7487",wave:"#CFE3E2",far:"#A7B9B6"},
  night:{a:"#1B2C47",b:"#2E3F5F",sun:"#F1E3B8",sea:"#0E2235",wave:"#3F5A7A",far:"#3A4A68"}
};
let sid = 0;
function scene(motif, skyKey, opts = {}){
  const p = SKY[skyKey] || SKY.day, id = "g" + (++sid);
  const W = 400, H = 250, hz = opts.hz || 158;
  const sunX = opts.sunX || 285, sunY = skyKey === "night" ? 62 : (skyKey === "dusk" ? hz - 12 : 70);
  const ink = "#0F1E2E", cream = "#F7F3EA";
  let waves = "";
  for(let i=0;i<5;i++){ const y = hz + 18 + i*18; let d = `M0 ${y}`; for(let x=0;x<W;x+=40) d += ` q10 -5 20 0 t20 0`; waves += `<path d="${d}" stroke="${p.wave}" stroke-width="2" fill="none" opacity="${(0.75-i*0.12).toFixed(2)}"/>`; }
  const stars = skyKey === "night" ? [[40,30],[90,55],[150,24],[210,48],[340,30],[370,80],[120,90]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4" fill="#F1E3B8"/>`).join("") : "";
  const hills = `<path d="M0 ${hz} C60 ${hz-26} 110 ${hz-30} 170 ${hz-12} S280 ${hz-20} 330 ${hz-8} S390 ${hz-14} 400 ${hz-10} V${hz} Z" fill="${p.far}" opacity=".55"/>`;
  const palm = (x, s=1) => `<g transform="translate(${x} ${hz}) scale(${s})" fill="${ink}" opacity=".88"><path d="M0 0 C2 -30 6 -60 14 -84" stroke="${ink}" stroke-width="3.2" fill="none"/><path d="M14 -84 c-14 -4 -26 2 -34 12 c12 -6 22 -8 34 -12z M14 -84 c12 -8 26 -6 34 4 c-12 -4 -22 -4 -34 -4z M14 -84 c-6 -12 -2 -24 6 -30 c-2 10 -2 20 -6 30z M14 -84 c-16 4 -24 16 -24 28 c4 -12 12 -20 24 -28z M14 -84 c14 2 24 14 26 26 c-6 -12 -14 -20 -26 -26z"/></g>`;
  const M = {
    sail:`<g transform="translate(120 ${hz+6})"><path d="M-46 0 h108 l-14 16 h-82z" fill="${ink}"/><path d="M6 -4 V-118 L60 -6z" fill="${cream}"/><path d="M0 -4 V-104 L-40 -6z" fill="#EDE3D0"/><line x1="4" y1="0" x2="4" y2="-122" stroke="${ink}" stroke-width="2.5"/></g>`,
    yacht:`<g transform="translate(150 ${hz+4})"><path d="M-80 0 h170 l-22 22 h-130z" fill="${cream}"/><path d="M-50 0 v-22 h90 l26 22z" fill="${cream}"/><path d="M-34 -22 v-16 h52 l14 16z" fill="#E6DCC6"/><rect x="-44" y="-16" width="70" height="7" rx="2" fill="${ink}"/><rect x="-26" y="-34" width="34" height="6" rx="2" fill="${ink}"/><path d="M-80 10 h170" stroke="${ink}" stroke-width="3"/></g>`,
    duffy:`<g transform="translate(150 ${hz+10})"><path d="M-62 0 h124 c0 12 -10 20 -22 20 h-80 c-12 0 -22 -8 -22 -20z" fill="${cream}"/><path d="M-52 -40 h104 l-6 -8 h-92z" fill="#C9553A"/><path d="M-52 -40 v40 M52 -40 v40" stroke="${ink}" stroke-width="3"/><path d="M-62 4 h124" stroke="${ink}" stroke-width="2"/></g>`,
    whale:`<g transform="translate(150 ${hz+18})" fill="${ink}"><path d="M0 0 c-4 -20 -2 -38 6 -52 c-22 -6 -40 -2 -50 10 c18 -2 30 4 36 14 c-4 8 -4 18 -2 28z M14 0 c4 -20 2 -38 -6 -52 c22 -6 40 -2 50 10 c-18 -2 -30 4 -36 14 c4 8 4 18 2 28z"/><ellipse cx="7" cy="2" rx="30" ry="4" fill="${p.wave}" opacity=".9"/></g>`,
    paddle:`<g transform="translate(150 ${hz+20})"><ellipse cx="0" cy="0" rx="62" ry="6" fill="${cream}"/><circle cx="0" cy="-66" r="8" fill="${ink}"/><path d="M0 -58 v34 M0 -24 l-10 24 M0 -24 l10 24 M0 -50 l20 10" stroke="${ink}" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M20 -40 l14 -40 M20 -40 l-8 44" stroke="${ink}" stroke-width="3" stroke-linecap="round"/></g>`,
    kayak:`<g transform="translate(150 ${hz+22})"><path d="M-70 0 c30 -10 110 -10 140 0 c-30 8 -110 8 -140 0z" fill="#C9553A"/><circle cx="-6" cy="-24" r="7" fill="${ink}"/><path d="M-6 -17 v14" stroke="${ink}" stroke-width="5" stroke-linecap="round"/><path d="M-50 -30 L40 -4" stroke="${ink}" stroke-width="3" stroke-linecap="round"/></g><g fill="${ink}" opacity=".85"><rect x="276" y="${hz+6}" width="40" height="10" rx="2"/><path d="M284 ${hz+6} c2 -10 10 -12 14 -6 c4 -6 10 -2 10 6z"/></g>`,
    bike:`<g transform="translate(160 ${hz+44})" stroke="${ink}" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"><circle cx="-44" cy="0" r="24"/><circle cx="44" cy="0" r="24"/><path d="M-44 0 l26 -40 h44 l18 40 M-18 -40 l20 40 h-46 M26 -40 l-4 -14 h12 M-24 -48 h16"/></g><rect x="0" y="${hz+68}" width="400" height="30" fill="#E6D8BF" opacity=".9"/>`,
    picnic:`<rect x="0" y="${hz+30}" width="400" height="70" fill="#E9D7B8"/><g transform="translate(160 ${hz+50})"><path d="M-90 0 l90 -30 l90 30 l-90 30z" fill="${cream}"/><path d="M-60 -10 l90 30 M-30 -20 l90 30 M-60 10 l90 -30 M-30 20 l90 -30" stroke="#C9553A" stroke-width="3" opacity=".8"/><rect x="-22" y="-26" width="44" height="16" rx="3" fill="${ink}"/></g><path d="M300 ${hz+30} V${hz-50}" stroke="${ink}" stroke-width="3"/><path d="M250 ${hz-46} q50 -40 100 0z" fill="#C9553A"/>`,
    ring:`<g transform="translate(200 ${hz-20})"><circle cx="0" cy="18" r="32" fill="none" stroke="#D9B66A" stroke-width="7"/><path d="M-14 -16 l14 -18 l14 18 l-14 14z" fill="${cream}" stroke="${ink}" stroke-width="2"/></g>${[[90,40],[110,70],[300,50],[320,90],[70,110],[340,120]].map(([x,y])=>`<path d="M${x} ${hz+y} c6 -8 14 -6 12 2 c-2 6 -10 6 -12 -2z" fill="#B8323A" opacity=".85"/>`).join("")}`,
    balloon:`${[[130,-60,"#C9553A"],[175,-80,"#D9B66A"],[220,-62,cream],[260,-84,"#C9553A"]].map(([x,y,c])=>`<path d="M${x} ${hz+y+28} q-4 30 4 60" stroke="${cream}" stroke-width="1.5" fill="none"/><ellipse cx="${x}" cy="${hz+y}" rx="20" ry="25" fill="${c}"/>`).join("")}`,
    flower:`<g transform="translate(200 ${hz+70})"><path d="M-26 0 h52 l-8 -60 h-36z" fill="${cream}"/><g stroke="#2F5D4A" stroke-width="3" fill="none"><path d="M0 -60 q-10 -40 -34 -70 M0 -60 q4 -50 2 -90 M0 -60 q14 -40 38 -66 M0 -60 q-24 -24 -54 -30 M0 -60 q26 -20 56 -22"/></g>${[[-34,-130,"#C9553A"],[2,-150,"#F1E3B8"],[38,-126,"#B8323A"],[-54,-90,"#E8A2A0"],[56,-82,"#D9B66A"]].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="13" fill="${c}"/><circle cx="${x}" cy="${y}" r="4" fill="${ink}" opacity=".5"/>`).join("")}</g>`,
    glass:`<g transform="translate(170 ${hz+40})"><path d="M-24 -96 h48 c0 30 -10 46 -24 48 c-14 -2 -24 -18 -24 -48z" fill="${cream}" opacity=".95"/><path d="M-20 -78 h40 c-2 18 -10 26 -20 28 c-10 -2 -18 -10 -20 -28z" fill="#B8323A"/><path d="M0 -48 v40 M-18 -8 h36" stroke="${cream}" stroke-width="4" stroke-linecap="round"/><ellipse cx="80" cy="-6" rx="46" ry="10" fill="${cream}"/><ellipse cx="80" cy="-8" rx="28" ry="5" fill="#E6DCC6"/></g>${[30,80,130,180,230,280,330,380].map((x,i)=>`<circle cx="${x}" cy="${48+Math.sin(i)*8}" r="3.5" fill="#F1E3B8"/>`).join("")}`,
    fish:`<path d="M60 ${hz+90} Q150 ${hz-120} 330 ${hz-70}" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M330 ${hz-70} V${hz+30}" stroke="${ink}" stroke-width="1"/><g transform="translate(330 ${hz+42})"><path d="M-18 0 c8 -10 24 -10 32 0 c-8 10 -24 10 -32 0z M14 0 l10 -8 v16z" fill="#D9B66A"/></g>`
  };
  const usePalm = ["bike","picnic","sail"].includes(motif);
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.a}"/><stop offset="1" stop-color="${p.b}"/></linearGradient></defs><rect width="${W}" height="${hz}" fill="url(#${id})"/>${stars}<circle cx="${sunX}" cy="${sunY}" r="${skyKey==="night"?18:30}" fill="${p.sun}"/>${hills}<rect y="${hz}" width="${W}" height="${H-hz}" fill="${p.sea}"/>${waves}${usePalm ? palm(360,.9) : ""}${M[motif] || ""}</svg>`;
}

const I = {
  sail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v14M12 4l7 12h-7M11 6l-6 10h6M3 19h18l-2 2H5z"/></svg>',
  paddle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="19" rx="9" ry="1.6"/><path d="M16 3l-6 15M15 3.5l2 1"/></svg>',
  bike:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16l4-7h6l3 7M9.5 9l3 7h-7M15 7h2"/></svg>',
  ring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="15" r="6"/><path d="M9 6l3-3 3 3-3 3z"/></svg>',
  flower:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="2.4"/><path d="M12 5.6c0-2 1.4-3 2.6-2.6 1 .8.4 2.6-1.4 3.6M12 5.6c0-2-1.4-3-2.6-2.6-1 .8-.4 2.6 1.4 3.6M12 10.4V21M12 16c-2-2-4-2-5-1M12 18c2-2 4-2 5-1"/></svg>',
  glass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 3h10c0 5-2 8-5 8s-5-3-5-8zM12 11v9M8 21h8"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l5-5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  tune:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .6 3.1 2.4 3.5 5.2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 17h18M7 17a5 5 0 0 1 10 0M12 7V4M5.5 10.5L4 9M18.5 10.5L20 9"/></svg>'
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app"), layer = $("#layer");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, d=0) => "$" + Number(n||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money2 = n => money(n, 2);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayLabel = s => fromIso(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const next7 = () => { const out = [], t = new Date(); t.setHours(0,0,0,0); for(let i=0;i<7;i++){ const d = new Date(t); d.setDate(t.getDate()+i); out.push(d);} return out; };
const lsGet = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2400); }
const genCode = () => { const a = "ACDEFGHJKMNPQRTUVWXY3469"; let s = ""; for(let i=0;i<6;i++) s += a[Math.floor(Math.random()*a.length)]; return s; };

/* price scale for the histogram: 18 log-spaced bins from $30 to $1,300 */
const NB = 18, PMIN = 30, PMAX = 1300;
const edge = i => i <= 0 ? 0 : i >= NB ? Infinity : Math.round(PMIN * Math.pow(PMAX/PMIN, i/NB) / 5) * 5;
const edgeLabel = i => i >= NB ? "Any" : money(edge(i));
const binOf = p => Math.max(0, Math.min(NB-1, Math.floor(Math.log(p/PMIN)/Math.log(PMAX/PMIN)*NB)));
const HIST = (() => { const h = Array(NB).fill(0); EXP.forEach(e => { const b = binOf(e.price); [[0,1],[-1,.55],[1,.55],[-2,.2],[2,.2]].forEach(([o,w]) => { if(h[b+o] !== undefined) h[b+o] += w; }); }); const m = Math.max(...h); return h.map(v => Math.max(.08, v/m)); })();

/* ---------- state ---------- */
const S = {
  db:null, live:false,
  rates:{commission:20, hotel:30},
  bookings: [], all: [], authErr: "",
  key: (() => { try { return sessionStorage.getItem("maree-key") || ""; } catch { return ""; } })(),
  mine: lsGet("maree-mine", []),
  saved: lsGet("maree-saved", []),
  f:{q:"", cat:"all", lo:0, hi:NB, when:"any", date:iso(new Date()), adults:2, kids:0},
  draft:null, gal:0, more:false
};
const guestName = () => (lsGet("maree-guest", {}).name || "").split(" ")[0];

function subtotalOf(e, d){
  const base = perGroup(e) ? e.price : e.price * d.guests;
  return base + e.addons.filter(a => d.addons.includes(a.id)).reduce((s,a) => s + a.price, 0);
}
function splitOf(b, rates = S.rates){
  const gross = b.status === "cancelled" ? 0 : b.subtotal;
  const commission = gross * rates.commission/100, hotel = commission * rates.hotel/100;
  const processing = gross && b.pay === "card" ? gross*0.029 + 0.30 : 0;
  return {gross, commission, hotel, processing, net: commission - hotel - processing, vendor: gross - commission};
}
function matches(e){
  const f = S.f;
  if(f.cat !== "all" && e.cat !== f.cat) return false;
  if(e.price < edge(f.lo) || e.price > edge(f.hi)) return false;
  if(f.q){ const q = f.q.toLowerCase(); if(!(e.title + " " + e.blurb + " " + catName(e.cat) + " " + e.place).toLowerCase().includes(q)) return false; }
  if(f.when !== "any"){
    const ok = e.times.some(t => {
      if(/^sunset/.test(t)) return f.when === "sunset" || f.when === "afternoon";
      if(/Evening/.test(t)) return f.when === "sunset";
      if(/Morning/.test(t)) return f.when === "morning";
      if(/Afternoon/.test(t)) return f.when === "afternoon";
      const m = /(\d+):\d+\s*(AM|PM)/.exec(t); if(!m) return true;
      const h = +m[1] % 12 + (m[2] === "PM" ? 12 : 0);
      return f.when === "morning" ? h < 12 : f.when === "afternoon" ? h >= 12 && h < 16 : h >= 16;
    });
    if(!ok) return false;
  }
  return true;
}
const filtersOn = () => S.f.cat !== "all" || S.f.lo > 0 || S.f.hi < NB || S.f.when !== "any" || !!S.f.q;

/* ---------- server API ---------- */
async function api(path, opts = {}){
  const headers = {"Content-Type":"application/json"};
  if(opts.partner && S.key) headers.Authorization = "Bearer " + S.key;
  const res = await fetch(path, {method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined});
  let data = null; try { data = await res.json(); } catch {}
  if(!res.ok){ const err = new Error((data && data.error) || "Request failed"); err.status = res.status; throw err; }
  return data;
}
async function loadMine(){
  if(!S.mine.length){ S.bookings = []; return; }
  try { const r = await api("/api/bookings?codes=" + encodeURIComponent(S.mine.join(","))); S.bookings = r.bookings; S.live = true; rerenderIf(["plans","booked","home"]); } catch {}
}
async function loadPartner(){
  if(!S.key) return;
  try {
    const [b, r] = await Promise.all([api("/api/partner/bookings", {partner:true}), api("/api/rates")]);
    S.all = b.bookings; S.rates = r.rates; S.live = true; S.authErr = "";
  } catch(e){
    if(e.status === 401){ S.key = ""; try { sessionStorage.removeItem("maree-key"); } catch {} S.authErr = "That password didn't work. Try again."; }
  }
  rerenderIf(["partner"]);
}
async function initDb(){
  try { S.rates = (await api("/api/rates")).rates; } catch {}
  loadMine();
  setInterval(() => { if(current === "partner" && !document.hidden) loadPartner(); }, 20000);
}
async function createBooking(b){
  const r = await api("/api/bookings", {method:"POST", body:b});
  S.bookings = [...S.bookings.filter(x => x.code !== r.booking.code), r.booking];
  return r.booking;
}
let rateTimer;
function saveRates(){ clearTimeout(rateTimer); rateTimer = setTimeout(() => { api("/api/rates", {method:"PUT", partner:true, body:S.rates}).catch(() => toast("Couldn't save the rates. Try again.")); }, 500); }

    else if(b.dataset.g){ d.guests = Math.max(1, Math.min(20, d.guests + (+b.dataset.g))); redraw(); }
    else if(b.hasAttribute("data-more")){ S.more = !S.more; redraw(); }
  };
  app.onchange = ev => {
    const c = ev.target.closest("[data-addon]"); if(!c) return;
    d.addons = c.checked ? [...new Set([...d.addons, c.dataset.addon])] : d.addons.filter(x => x !== c.dataset.addon);
    redraw();
  };
  function redraw(){ const y = scrollY, fid = document.activeElement && document.activeElement.dataset; viewDetail(id); scrollTo(0, y); }
}

function viewCheckout(){
  const d = S.draft, e = d && byId[d.expId];
  if(!e){ location.hash = "home"; return; }
  app.className = "app";
  const sub = subtotalOf(e, d), day = fromIso(d.date);
  const g = lsGet("maree-guest", {name:"", room:"", phone:""});
  app.innerHTML = `
  <div class="pad" style="padding-bottom:30px">
    <div class="bar-h"><a class="iconbtn" href="#exp-${e.id}" aria-label="Back">${I.back}</a><h1>Confirm and pay</h1><span></span></div>
    <div class="mini" style="margin-top:18px"><div class="th">${scene(e.motif, e.sky)}</div><div><b>${esc(e.title)}</b><div>${esc(dayLabel(d.date))} · ${esc(slotLabel(d.time, day))}</div><div>${d.guests} guest${d.guests>1?"s":""} · ${esc(e.place)}</div></div></div>
    <form id="coForm" novalidate>
      <div class="f"><label for="gname">Name on the booking</label><div class="inp"><input id="gname" autocomplete="name" value="${esc(g.name)}" placeholder="Alex Rivera"></div></div>
      <div class="two" style="margin-top:0">
        <div class="f"><label for="groom">Room</label><div class="inp"><input id="groom" inputmode="numeric" value="${esc(g.room)}" placeholder="412"></div></div>
        <div class="f"><label for="gphone">Mobile</label><div class="inp"><input id="gphone" type="tel" autocomplete="tel" value="${esc(g.phone)}" placeholder="(310) 555-0142"></div></div>
      </div>
      <fieldset style="border:0;padding:0;margin:18px 0 0"><legend style="font-weight:700;font-size:14px;padding:0">Pay with</legend>
        <label class="pay"><input type="radio" name="pay" value="room" checked><span><b>Charge to my room</b><small>Settled at checkout</small></span></label>
        <label class="pay"><input type="radio" name="pay" value="card"><span><b>Card or phone wallet</b><small>Secure checkout through Stripe</small></span></label>
      </fieldset>
      <div class="lines num">
        <div><span class="muted">${perGroup(e) ? esc(e.unit) : `${d.guests} × ${money(e.price)}`}</span><span>${money2(perGroup(e)?e.price:e.price*d.guests)}</span></div>
        ${e.addons.filter(a=>d.addons.includes(a.id)).map(a=>`<div><span class="muted">${esc(a.name)}</span><span>${money2(a.price)}</span></div>`).join("")}
        <div class="tot"><span>Total</span><span>${money2(sub)}</span></div>
      </div>
      <p class="demo">Prototype: no charge is made and no card details are collected. Bookings are saved so you can see the commission math on the Partner tab.</p>
      <p class="err" id="coErr" hidden></p>
      <button class="btn btn-ink block" type="submit" id="coBtn" style="margin-top:16px">Confirm · ${money2(sub)}</button>
    </form>
  </div>`;
  $("#coForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#gname").value.trim(), room = $("#groom").value.trim(), phone = $("#gphone").value.trim(), err = $("#coErr");
    if(!name || !room){ err.textContent = "Add your name and room number so the front desk can match the booking."; err.hidden = false; return; }
    err.hidden = true; lsSet("maree-guest", {name, room, phone});
    const btn = $("#coBtn"); btn.disabled = true; btn.textContent = "Confirming…";
    const req = {expId:e.id, date:d.date, time:slotLabel(d.time, day), guests:d.guests, addons:[...d.addons],
      guestName:name, room, phone, pay:new FormData(ev.target).get("pay")};
    try {
      const b = await createBooking(req);
      S.mine = [...S.mine, b.code]; lsSet("maree-mine", S.mine);
      S.last = b; S.draft = null; location.hash = "booked-" + b.code;
    } catch(x) {
      btn.disabled = false; btn.textContent = `Confirm · ${money2(sub)}`;
      err.textContent = x.status === 400 ? x.message : "The booking didn't go through. Check your connection and try again."; err.hidden = false;
    }
  });
}

function viewPlans(){
  app.className = "app";
  const mine = S.bookings.filter(b => S.mine.includes(b.code)).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  app.innerHTML = `
  <div class="pad">
    <div class="top"><div class="hello"><h1>My plans</h1><p>Everything booked for your stay</p></div></div>
    <section class="sec">${mine.length ? `<div class="vlist" style="gap:12px">${mine.map(b => { const e = byId[b.expId] || {motif:"sail",sky:"day"}; return `

          ${b.status === "cancelled" ? `<span class="pill no">Cancelled</span>` : `<span class="pill ok">Confirmed · ${esc(b.code)}</span>`}</div>
        ${b.status !== "cancelled" ? `<div class="acts"><a class="sbtn" href="#booked-${esc(b.code)}">Ticket</a><button class="sbtn" type="button" data-cancel="${esc(b.code)}">Cancel</button></div>` : ""}

  </div>${nav("plans")}`;
}

function viewPartnerLogin(){
  app.className = "app";
  app.innerHTML = `
  <div class="pad">
    <div class="top"><div class="hello"><h1>Partner desk</h1><p>Commission, hotel share and payouts</p></div></div>
    <form id="pkForm" class="sec" novalidate>
      <div class="f"><label for="pk">Partner password</label><div class="inp"><input id="pk" type="password" autocomplete="current-password" placeholder="Enter your password"></div></div>
      <p class="err" id="pkErr" ${S.authErr ? "" : "hidden"}>${esc(S.authErr)}</p>
      <button class="btn btn-ink block" type="submit" style="margin-top:16px">Open the desk</button>
      <p class="note" style="margin-top:12px">Guests never see this page. The password is set as PARTNER_PASSWORD in Railway.</p>
    </form>
  </div>${nav("partner")}`;
  $("#pkForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const v = $("#pk").value.trim(); if(!v) return;
    S.key = v; try { sessionStorage.setItem("maree-key", v); } catch {}
    S.authErr = ""; await loadPartner(); route();
  });
}

function viewPartner(){
  if(!S.key){ viewPartnerLogin(); return; }
  if(!S.loadedPartner){ S.loadedPartner = true; loadPartner(); }
  app.className = "app wide";
  const all = [...S.all].sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));
  const live = all.filter(b => b.status !== "cancelled");
  const T = live.reduce((t,b) => { const s = splitOf(b); for(const k in s) t[k] = (t[k]||0) + s[k]; return t; }, {gross:0,commission:0,hotel:0,processing:0,net:0,vendor:0});
  const byCat = CATS.map(c => ({c, v: live.filter(b => b.cat === c.id).reduce((s,b) => s + splitOf(b).net, 0)})).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const maxCat = Math.max(1, ...byCat.map(x => x.v));
  const byPartner = {}; live.forEach(b => { byPartner[b.partner] = (byPartner[b.partner]||0) + splitOf(b).vendor; });
  const ex = splitOf({subtotal:100, status:"confirmed", pay:"room"}), exCard = splitOf({subtotal:100, status:"confirmed", pay:"card"});
  const samples = all.filter(b => b.sample).length;
  app.innerHTML = `
  <div class="pad">
    <div class="desk-top">
      <div class="hello"><h1>Partner desk</h1><p>Commission, hotel share and payouts</p></div>
      <p class="note" style="max-width:42ch">Live: new guest bookings appear here within 20 seconds. <button class="sbtn" type="button" data-logout style="margin-left:6px">Sign out</button>${samples ? ` ${samples} sample booking${samples>1?"s are":" is"} included and marked.` : ""}</p>
    </div>
    <div class="kpis num">
      <div class="kpi"><small>Gross bookings</small><b>${money(T.gross)}</b><span>${live.length} booking${live.length===1?"":"s"} · avg ${money(live.length ? T.gross/live.length : 0)}</span></div>
      <div class="kpi you"><small>Your earnings</small><b>${money(T.net)}</b><span>after hotel share and card fees</span></div>
      <div class="kpi"><small>Hotel's share</small><b>${money(T.hotel)}</b><span>${S.rates.hotel}% of your commission</span></div>
      <div class="kpi"><small>Owed to partners</small><b>${money(T.vendor)}</b><span>${100 - S.rates.commission}% of each booking</span></div>
    </div>
    <div class="dgrid">
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <section class="card" aria-labelledby="rt-h">
          <h2 id="rt-h">Your rates</h2>
          <div class="rng"><header><label for="rc">Commission from partners</label><output for="rc">${S.rates.commission}%</output></header><input id="rc" type="range" min="5" max="35" step="1" value="${S.rates.commission}"><span class="note">Booking marketplaces typically take 20–30%.</span></div>
          <div class="rng"><header><label for="rh">Hotel's cut of your commission</label><output for="rh">${S.rates.hotel}%</output></header><input id="rh" type="range" min="0" max="60" step="5" value="${S.rates.hotel}"><span class="note">What you offer the hotel for promoting Marée to guests.</span></div>
          <div><p style="font-weight:700;font-size:14px;margin-bottom:8px">Where $100 of bookings goes</p>
            <div class="split" role="img" aria-label="Partner ${money2(ex.vendor)}, hotel ${money2(ex.hotel)}, you ${money2(ex.net)}"><i style="width:${ex.vendor}%;background:#C9CACE"></i><i style="width:${ex.hotel}%;background:#7A7B80"></i><i style="width:${ex.net}%;background:var(--ink)"></i></div>
            <div class="legend num" style="margin-top:10px">
              <div><i style="background:#C9CACE"></i>Partner<b>${money2(ex.vendor)}</b></div>
              <div><i style="background:#7A7B80"></i>Hotel<b>${money2(ex.hotel)}</b></div>
              <div><i style="background:var(--ink)"></i>You, room charge<b>${money2(ex.net)}</b></div>
              <div><i style="background:var(--ink);opacity:.45"></i>You, card (−2.9% + 30¢)<b>${money2(exCard.net)}</b></div>
            </div></div>
        </section>
        <section class="card" aria-labelledby="ct-h"><h2 id="ct-h">Your earnings by category</h2>
          ${byCat.length ? `<div class="bars num">${byCat.map(x => `<div class="bar"><span>${esc(x.c.name)}</span><div class="tr"><div class="fl" style="width:${(x.v/maxCat*100).toFixed(1)}%"></div></div><b>${money(x.v)}</b></div>`).join("")}</div>` : `<p class="note">No bookings yet.</p>`}
        </section>
        <section class="card" aria-labelledby="po-h"><h2 id="po-h">Payouts owed to partners</h2>
          ${Object.keys(byPartner).length ? `<div class="payouts num">${Object.entries(byPartner).sort((a,b)=>b[1]-a[1]).map(([p,v]) => `<div><span>${esc(p)}</span><b>${money2(v)}</b></div>`).join("")}</div>` : `<p class="note">Nothing owed yet.</p>`}
          <p class="note">With Stripe Connect these go out automatically after each experience.</p>
        </section>
      </div>
      <section class="card" aria-labelledby="bk-h"><h2 id="bk-h">Bookings</h2>
        ${all.length ? `<div class="tbl"><table class="num"><thead><tr><th>When</th><th>Guest</th><th>Experience</th><th>Paid by</th><th class="r">Gross</th><th class="r">Hotel</th><th class="r">You</th><th>Status</th></tr></thead>
          <tbody>${all.map(b => { const s = splitOf(b); return `<tr class="${b.status==="cancelled"?"cx":""}">
            <td>${esc(dayLabel(b.date))}<div class="note">${esc(b.time)}</div></td>
            <td>${esc(b.guestName)}<div class="note">Room ${esc(b.room)}</div></td>
            <td>${esc(b.title)}<div class="note">${b.guests} guest${b.guests>1?"s":""}${b.addons && b.addons.length ? " · " + b.addons.length + " add-on" + (b.addons.length>1?"s":"") : ""}</div></td>
            <td>${b.pay === "room" ? "Room" : "Card"}</td>
            <td class="r">${money2(b.subtotal)}</td><td class="r">${money2(s.hotel)}</td><td class="r"><b>${money2(s.net)}</b></td>
            <td>${b.status === "cancelled" ? `<span class="pill no">Cancelled</span>` : b.sample ? `<span class="pill sm">Sample</span>` : `<span class="pill ok">Confirmed</span>`}</td></tr>`; }).join("")}</tbody></table></div>`
        : `<div class="empty">No bookings yet. Reserve something from the Home tab and it lands here with the split worked out.</div>`}
        <p class="note">Figures use the rates on the left. Cancelled bookings don't count toward totals.</p>
      </section>
    </div>
  </div>${nav("partner")}`;
  $("#rc").oninput = ev => { S.rates.commission = +ev.target.value; saveRates(); keep("rc"); };
  $("#rh").oninput = ev => { S.rates.hotel = +ev.target.value; saveRates(); keep("rh"); };
  function keep(id){ const y = scrollY; viewPartner(); scrollTo(0, y); const el = document.getElementById(id); if(el) el.focus(); }
}

/* ---------- router ---------- */
let current = "home";
function route(){
  app.onclick = app.onchange = null;
  let h = (location.hash || "").slice(1);
  if(!h) h = lsGet("maree-welcomed", false) ? "home" : "welcome";
  current = h.startsWith("exp-") ? "detail" : h.startsWith("booked-") ? "booked" : h;
  if(current === "welcome") viewWelcome();
  else if(current === "detail") viewDetail(h.slice(4));
  else if(current === "booked") viewBooked(h.slice(7));
  else if(current === "all") viewAll();
  else if(current === "saved") viewSaved();
  else if(current === "checkout") viewCheckout();
  else if(current === "plans") viewPlans();
  else if(current === "partner") viewPartner();
  else { current = "home"; viewHome(); }
}
function rerenderIf(views){
  if(!views.includes(current) || layer.innerHTML) return;
  if(document.activeElement && document.activeElement.type === "range") return;
  const y = scrollY; route(); scrollTo(0, y);
}
window.addEventListener("hashchange", () => { layer.innerHTML = ""; S.loadedPartner = false; route(); scrollTo(0, 0); });

document.addEventListener("click", async ev => {
  const t = ev.target;
  if(t.closest("[data-welcomed]")) lsSet("maree-welcomed", true);
  if(t.closest("[data-logout]")){ S.key = ""; S.all = []; S.loadedPartner = false; try { sessionStorage.removeItem("maree-key"); } catch {} route(); return; }
  if(t.closest("[data-open-search]")){ openSheet(); return; }
  const sv = t.closest("[data-save]");
  if(sv){ ev.preventDefault(); const id = sv.dataset.save; S.saved = S.saved.includes(id) ? S.saved.filter(x => x !== id) : [...S.saved, id]; lsSet("maree-saved", S.saved); sv.setAttribute("aria-pressed", S.saved.includes(id)); toast(S.saved.includes(id) ? "Saved" : "Removed from saved"); if(current === "saved") viewSaved(); return; }
  const c = t.closest("[data-cat]");
  if(c){ S.f.cat = c.dataset.cat; route(); scrollTo(0,0); return; }
  const q = t.closest("[data-quick]");
  if(q){ S.f.when = S.f.when === "sunset" ? "any" : "sunset"; route(); return; }
  if(t.closest("[data-reset]")){ Object.assign(S.f, {q:"", cat:"all", lo:0, hi:NB, when:"any"}); route(); return; }
  const cx = t.closest("[data-cancel]");
  if(cx){
    if(cx.dataset.armed !== "1"){ cx.dataset.armed = "1"; cx.textContent = "Confirm"; setTimeout(() => { if(cx.isConnected){ cx.dataset.armed = ""; cx.textContent = "Cancel"; } }, 3500); return; }
    const code = cx.dataset.cancel;
    try { const r = await api("/api/bookings/" + encodeURIComponent(code) + "/cancel", {method:"POST"}); S.bookings = S.bookings.map(x => x.code === code ? r.booking : x); viewPlans(); toast("Booking cancelled"); } catch { toast("Couldn't cancel. Try again."); }
  }
});

route();
initDb();
})();
</script>
