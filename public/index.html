<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Marée Quotes</title>
<meta name="description" content="Get a quote for equipment rentals, boats, tours, cars, catering and more around Marina del Rey. A local company calls or emails you back.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/shared.css">
<style>
/* Layout: one centered column, one question per screen, large tappable answers — the insurance-quote pattern. */
body{background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:6px}
.wordmark{font-weight:800;letter-spacing:.06em;font-size:16px;display:flex;align-items:flex-start;gap:2px}
.wordmark i{width:6px;height:6px;border:1.5px solid var(--ink);border-radius:50%;margin-top:1px}
.langbtn{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:700;font-size:13px}
.langbtn svg{width:17px;height:17px}
.progress{height:4px;background:var(--soft-2);border-radius:2px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .35s ease}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;height:44px;font-weight:700;font-size:14px;color:var(--muted);margin-top:8px}
.back svg{width:18px;height:18px}
.back[hidden]{display:none}
.intro{padding-top:18px}
.intro h1{font-size:clamp(28px,6.5vw,38px);line-height:1.12;letter-spacing:-.03em;max-width:18ch}
.intro p{color:var(--muted);font-size:16px;margin-top:10px;max-width:46ch}
.trust{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.trust span{display:inline-flex;align-items:center;gap:6px}
.trust svg{width:16px;height:16px;color:var(--ok)}
.q{padding-top:22px;display:flex;flex-direction:column;gap:16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.q h2{font-size:clamp(22px,5vw,28px);letter-spacing:-.025em;line-height:1.2}
.q .sub{color:var(--muted);font-size:14.5px;margin-top:-8px}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:14px;min-height:64px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);padding:10px 16px 10px 10px;transition:border-color .15s,background .15s}
.ans:hover{border-color:#BDBDC2}
.ans[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.ans.plain{padding-left:18px}
.ans .th{width:52px;height:52px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.ans .tx{flex:1;min-width:0}
.ans .tx b{display:block;font-size:16px;line-height:1.25}
.ans .tx small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ans .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.ans[aria-pressed="true"] .radio{border-color:var(--ink)}
.ans[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.ans .chev{width:18px;height:18px;flex:none;color:var(--faint)}
.grid2a{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{height:64px;border:1.5px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;max-width:260px}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:var(--soft);font-size:22px;display:grid;place-items:center}
.stepper b{font-size:22px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.actions{display:flex;gap:10px;align-items:center;margin-top:6px}
.actions .btn{flex:1;height:56px;font-size:16px}
.linkbtn{border:0;background:none;padding:0 6px;height:44px;font-weight:700;color:var(--muted);font-size:14.5px;text-decoration:underline}
.review{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.review .rh{display:flex;gap:12px;align-items:center;padding:12px;background:var(--soft)}
.review .rh .th{width:56px;height:56px;border-radius:12px;overflow:hidden;position:relative;flex:none}
.review .rh b{font-size:16px}
.rrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px}
.rrow span{color:var(--muted);flex:none}
.rrow b{text-align:right;font-weight:600;overflow-wrap:break-word;flex:1;min-width:0}
.rrow span{max-width:45%}
.rrow.col{flex-wrap:wrap}
.rrow.col span{max-width:none;flex:1}
.rrow.col b{flex-basis:100%;order:3;text-align:left;white-space:pre-wrap;font-weight:500}
.rrow button{border:0;background:none;padding:0 0 0 8px;font-weight:700;font-size:13px;text-decoration:underline;color:var(--ink-2);flex:none}
.done{padding-top:40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;animation:fade .3s ease}
.seal{width:76px;height:76px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.seal svg{width:34px;height:34px}
.done h2{font-size:30px;letter-spacing:-.03em}
.done p{color:var(--ink-2);font-size:16px;max-width:38ch}
.refbox{border:1.5px dashed var(--line);border-radius:18px;padding:14px 22px;margin-top:6px}
.refbox small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.refbox b{font-size:26px;letter-spacing:.14em}
.foot{margin-top:auto;padding-top:34px;font-size:12.5px;color:var(--faint);text-align:center}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.langlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
@media (max-width:420px){.grid2a{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.q,.done{animation:none}}
</style>
</head>
<body>
<div class="wrap pad" id="app"></div>
<div id="layer"></div>
<script src="/i18n.js"></script>
<script src="/catalog.js"></script>
<script src="/shared.js"></script>
<script>
(() => {
"use strict";
const { CATS, OPTIONS, FIELDS } = window.MAREE_CATALOG;
const { esc, money, store, img, api, toast, makeT } = window.M;
const LANGS = window.MAREE_I18N.LANGS, NAMES = window.MAREE_I18N.I18N;
const app = document.getElementById("app"), layer = document.getElementById("layer");
const optById = Object.fromEntries(OPTIONS.map((o) => [o.id, o])), catById = Object.fromEntries(CATS.map((c) => [c.id, c]));
const I = {
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>',
  back: window.M.ICON.back,
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
};

/* ---------- state (kept for this tab, so a refresh doesn't lose answers) ---------- */
const guessLang = () => { const n = (navigator.language || "en").slice(0, 2); return LANGS.includes(n) ? n : "en"; };
const saved = (() => { try { return JSON.parse(sessionStorage.getItem("maree-q") || "null"); } catch { return null; } })();
const blank = () => ({ cat: null, optionId: null, vendorId: "", fields: {}, notes: "", ...store.get("maree-contact", { name: "", email: "", phone: "" }), contactPref: "call", step: 0, done: null });
const Q = saved && !saved.done ? saved : blank();
let lang = store.get("maree-lang", guessLang()), t = makeT(lang), CTR = null, vendors = [], err = "";
document.documentElement.lang = lang;
const persist = () => { try { sessionStorage.setItem("maree-q", JSON.stringify(Q)); } catch {} };
const tx = (o, k) => (CTR && CTR[o.id + "." + k]) || o[k];
async function loadCatalogLang() {
  CTR = null; if (lang === "en") return;
  const want = lang;
  try { const r = await api("/api/catalog?lang=" + want); if (lang === want && r.strings) { CTR = r.strings; render(); } } catch {}
}
async function loadVendors() {
  vendors = [];
  if (!Q.optionId) return;
  const want = Q.optionId;
  try { const r = await api(`/api/options/${want}/vendors`); if (Q.optionId === want) { vendors = r.vendors; if (!vendors.some((v) => String(v.id) === String(Q.vendorId))) Q.vendorId = ""; } } catch {}
}

/* ---------- the question list for the current answers ---------- */
function steps() {
  const s = ["cat", "option"];
  if (Q.optionId && vendors.length > 1) s.push("vendor");
  if (Q.cat) for (const k of catById[Q.cat].fields) s.push("f:" + k);
  s.push("notes", "contact", "review");
  return s;
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmtDate = (s) => { try { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(lang, { weekday: "short", month: "short", day: "numeric" }); } catch { return s; } };
function valueText(k, v) {
  if (v === undefined || v === null || v === "") return "—";
  if (k === "date") return fmtDate(v);
  if (k === "dates") return fmtDate(v.from) + (v.to && v.to !== v.from ? " → " + fmtDate(v.to) : "");
  if (typeof v === "number") return String(v);
  return t("c_" + v);
}
const opTypical = (o) => t("typical_short", { price: t("from", { price: money(o.from) }), unit: t("unit_" + o.unit) });

/* ---------- screens ---------- */
function screen(id) {
  if (id === "cat") return `
    <h2>${esc(t("q_cat"))}</h2>
    <div class="answers">${CATS.map((c) => `<button type="button" class="ans" data-cat="${c.id}" aria-pressed="${Q.cat === c.id}">
      <span class="th ph-fallback">${img(c.photo.src, 120)}</span><span class="tx"><b>${esc(t("cat_" + c.id))}</b><small>${esc(t("options_n", { n: OPTIONS.filter((o) => o.cat === c.id).length }))}</small></span>${I.chev}</button>`).join("")}</div>`;
  if (id === "option") return `
    <h2>${esc(t("q_option"))}</h2><p class="sub">${esc(t("cat_" + Q.cat))}</p>
    <div class="answers">${OPTIONS.filter((o) => o.cat === Q.cat).map((o) => `<button type="button" class="ans" data-opt="${o.id}" aria-pressed="${Q.optionId === o.id}">
      <span class="th ph-fallback">${img(o.photos[0].src, 120)}</span><span class="tx"><b>${esc(tx(o, "title"))}</b><small>${esc(opTypical(o))}</small></span>${I.chev}</button>`).join("")}</div>`;
  if (id === "vendor") return `
    <h2>${esc(t("q_vendor"))}</h2>
    <div class="answers">
      <button type="button" class="ans plain" data-vendor="" aria-pressed="${!Q.vendorId}"><span class="tx"><b>${esc(t("no_pref"))}</b><small>${esc(t("no_pref_sub"))}</small></span><span class="radio"></span></button>
      ${vendors.map((v) => `<button type="button" class="ans plain" data-vendor="${v.id}" aria-pressed="${String(Q.vendorId) === String(v.id)}"><span class="tx"><b>${esc(v.name)}</b></span><span class="radio"></span></button>`).join("")}
    </div>`;
  if (id.startsWith("f:")) {
    const k = id.slice(2), f = FIELDS[k], v = Q.fields[k];
    const title = `<h2>${esc(t("f_" + k))}</h2>`;
    if (f.type === "date") return `${title}<div class="f"><label class="sr" for="fd">${esc(t("f_" + k))}</label><div class="inp"><input id="fd" type="date" min="${today()}" value="${esc(v || "")}"></div></div>${err ? `<p class="err" role="alert">${esc(err)}</p>` : ""}${actions(true)}`;
    if (f.type === "daterange") return `${title}<div class="two">
        <div class="f"><label for="fr">${esc(t("f_from"))}</label><div class="inp"><input id="fr" type="date" min="${today()}" value="${esc(v ? v.from : "")}"></div></div>
        <div class="f"><label for="ft">${esc(t("f_to"))}</label><div class="inp"><input id="ft" type="date" min="${today()}" value="${esc(v ? v.to : "")}"></div></div></div>${err ? `<p class="err" role="alert">${esc(err)}</p>` : ""}${actions(true)}`;
    if (f.type === "stepper") return `${title}<div class="stepper" role="group" aria-label="${esc(t("f_" + k))}"><button type="button" data-step="-1" aria-label="−">−</button><b class="num" aria-live="polite">${v ?? f.def}</b><button type="button" data-step="1" aria-label="+">+</button></div>${actions(true)}`;
    if (f.type === "chips") return `${title}<div class="answers ${f.choices.length > 4 ? "grid2a" : ""}">${f.choices.map((c) => `<button type="button" class="ans plain" data-chip="${c}" aria-pressed="${v === c}"><span class="tx"><b>${esc(t("c_" + c))}</b></span><span class="radio"></span></button>`).join("")}</div>
      <div class="actions" style="justify-content:flex-start"><button type="button" class="linkbtn" data-next>${esc(t("skip"))}</button></div>`;
  }
  if (id === "notes") return `<h2>${esc(t("f_notes"))}</h2>
    <div class="f"><label class="sr" for="fn">${esc(t("f_notes"))}</label><div class="inp"><textarea id="fn" rows="5" maxlength="2000" placeholder="${esc(t("notes_ph"))}">${esc(Q.notes)}</textarea></div></div>${actions(true)}`;
  if (id === "contact") return `<h2>${esc(t("q_contact"))}</h2>
    <div class="f"><label for="cn">${esc(t("f_name"))}</label><div class="inp"><input id="cn" autocomplete="name" value="${esc(Q.name)}" maxlength="80"></div></div>
    <div class="f"><label for="cp">${esc(t("f_phone"))}</label><div class="inp"><input id="cp" type="tel" autocomplete="tel" inputmode="tel" value="${esc(Q.phone)}" maxlength="30"></div></div>
    <div class="f"><label for="ce">${esc(t("f_email"))}</label><div class="inp"><input id="ce" type="email" autocomplete="email" inputmode="email" value="${esc(Q.email)}" maxlength="120"></div></div>
    <div class="f"><span class="l" id="pref-l">${esc(t("f_contact_pref"))}</span><div class="seg" role="group" aria-labelledby="pref-l">${["call", "text", "email"].map((p) => `<button type="button" data-pref="${p}" aria-pressed="${Q.contactPref === p}">${esc(t("c_" + p))}</button>`).join("")}</div></div>
    <p class="note">${esc(t("contact_note").split(".")[0])}.</p>
    ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ""}${actions(true)}`;
  if (id === "review") {
    const o = optById[Q.optionId], s = steps(), v = vendors.find((x) => String(x.id) === String(Q.vendorId));
    const row = (label, val, step, col) => `<div class="rrow${col ? " col" : ""}"><span>${esc(label)}</span><b>${esc(val)}</b><button type="button" data-goto="${s.indexOf(step)}">${esc(t("edit"))}</button></div>`;
    return `<h2>${esc(t("q_review"))}</h2>
    <div class="review">
      <div class="rh"><span class="th ph-fallback">${img(o.photos[0].src, 120)}</span><div><b>${esc(tx(o, "title"))}</b><div class="note">${esc(t("cat_" + Q.cat))}${vendors.length > 1 ? " · " + esc(v ? v.name : t("no_pref")) : ""}</div></div></div>
      ${catById[Q.cat].fields.map((k) => row(t("f_" + k), valueText(k, Q.fields[k]), "f:" + k)).join("")}
      ${row(t("f_notes"), Q.notes || "—", "notes", !!Q.notes)}
      ${row(t("contact"), [Q.name, Q.phone, Q.email].filter(Boolean).join(" · "), "contact")}
      ${row(t("f_contact_pref"), t("c_" + Q.contactPref), "contact")}
    </div>
    ${err ? `<p class="err" role="alert">${esc(err)}</p>` : ""}
    <div class="actions"><button class="btn btn-ink" type="button" data-submit>${esc(t("submit"))}</button></div>
    <p class="note" style="text-align:center">${esc(t("free_no_payment"))}</p>`;
  }
  return "";
}
const actions = (cont) => `<div class="actions"><button class="btn btn-ink" type="button" data-next>${esc(t("next"))}</button></div>`;

function header() {
  return `<div class="top"><a class="wordmark" href="/" data-home>MARÉE<i></i></a><button class="langbtn" type="button" data-lang-open aria-label="${esc(t("language"))}">${I.globe}<span>${lang.toUpperCase()}</span></button></div>`;
}
function render() {
  if (Q.done) return renderDone();
  const s = steps();
  Q.step = Math.min(Q.step, s.length - 1);
  const id = s[Q.step];
  const pct = Math.round((Q.step / (s.length - 1)) * 100);
  app.innerHTML = `${header()}
    ${Q.step === 0 ? `<div class="intro"><h1>${esc(t("q_title"))}</h1><p>${esc(t("q_sub"))}</p>
      <div class="trust"><span>${I.check}${esc(t("trust_free"))}</span><span>${I.check}${esc(t("trust_fast"))}</span><span>${I.check}${esc(t("trust_local"))}</span></div></div>` : `
      <div class="progress" role="progressbar" aria-label="${esc(t("step", { n: Q.step + 1, total: s.length }))}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${Math.max(6, pct)}%"></i></div>
      <button class="back" type="button" data-back>${I.back}${esc(t("back"))}</button>`}
    <section class="q" aria-live="polite">${screen(id)}</section>
    <p class="foot">Marée · Marina del Rey</p>`;
  persist();
  const focus = app.querySelector("input,textarea"); if (focus && !("ontouchstart" in window)) focus.focus({ preventScroll: true });
}
function renderDone() {
  const d = Q.done;
  const company = d.vendor || t("done_any");
  app.innerHTML = `${header()}<section class="done">
    <div class="seal">${I.check}</div>
    <h2>${esc(t("done_title"))}</h2>
    <p>${esc(t("done_body", { company, method: t("m_" + d.contactPref) }))}</p>
    <div class="refbox"><small>${esc(t("your_ref"))}</small><b class="num">${esc(d.code)}</b></div>
    ${d.guestCopy ? `<p class="note">${esc(t("done_email"))}</p>` : ""}
    <button class="btn btn-ink" type="button" data-again style="margin-top:10px">${esc(t("another"))}</button>
  </section><p class="foot">Marée · Marina del Rey</p>`;
  persist();
}

/* ---------- navigation ---------- */
function go(n) { Q.step = n; err = ""; history.pushState({ step: n }, "", "#s-" + n); render(); scrollTo({ top: 0 }); }
function next() { go(Math.min(Q.step + 1, steps().length - 1)); }
window.addEventListener("popstate", (e) => { if (Q.done) return; const n = e.state && typeof e.state.step === "number" ? e.state.step : 0; Q.step = Math.min(n, steps().length - 1); err = ""; render(); });
function readInputs() {
  const id = steps()[Q.step];
  if (id.startsWith("f:")) {
    const k = id.slice(2), f = FIELDS[k];
    if (f.type === "date") Q.fields[k] = (document.getElementById("fd") || {}).value || "";
    if (f.type === "daterange") { const a = document.getElementById("fr").value, b = document.getElementById("ft").value; Q.fields[k] = a ? { from: a, to: b && b >= a ? b : a } : undefined; }
    if (f.type === "stepper" && Q.fields[k] === undefined) Q.fields[k] = f.def;
  }
  if (id === "notes") Q.notes = document.getElementById("fn").value;
  if (id === "contact") { Q.name = document.getElementById("cn").value.trim(); Q.phone = document.getElementById("cp").value.trim(); Q.email = document.getElementById("ce").value.trim(); }
}
function validate() {
  const id = steps()[Q.step];
  if (id.startsWith("f:")) { const k = id.slice(2), f = FIELDS[k]; if (f.required && !(f.type === "daterange" ? Q.fields[k] && Q.fields[k].from : Q.fields[k])) return t("err_date"); }
  if (id === "contact") {
    if (!Q.name) return t("err_name");
    if (!Q.phone && !Q.email) return t("err_contact");
    if (Q.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(Q.email)) return t("err_email");
    if ((Q.contactPref === "call" || Q.contactPref === "text") && !Q.phone) return t("err_phone_needed");
    if (Q.contactPref === "email" && !Q.email) return t("err_email_needed");
  }
  return "";
}
async function submit(btn) {
  readInputs();
  btn.disabled = true; btn.textContent = t("sending"); err = "";
  store.set("maree-contact", { name: Q.name, email: Q.email, phone: Q.phone });
  try {
    const r = await api("/api/tickets", { method: "POST", body: { optionId: Q.optionId, vendorId: Q.vendorId || undefined, fields: Q.fields, notes: Q.notes, name: Q.name, email: Q.email, phone: Q.phone, contactPref: Q.contactPref, lang } });
    Q.done = r; history.replaceState({ step: Q.step }, "", "#done"); render(); scrollTo({ top: 0 });
  } catch (e) {
    err = e.status && e.status < 500 ? e.message : t("err_network"); render();
  }
}

app.addEventListener("click", async (e) => {
  const b = e.target.closest("button,a"); if (!b) return;
  if (b.dataset.cat) { if (Q.cat !== b.dataset.cat) { Q.cat = b.dataset.cat; Q.optionId = null; Q.vendorId = ""; Q.fields = {}; } next(); return; }
  if (b.dataset.opt) { if (Q.optionId !== b.dataset.opt) { Q.optionId = b.dataset.opt; Q.vendorId = ""; } b.setAttribute("aria-pressed", "true"); await loadVendors(); next(); return; }
  if (b.dataset.vendor !== undefined) { Q.vendorId = b.dataset.vendor; next(); return; }
  if (b.dataset.chip) { const k = steps()[Q.step].slice(2); Q.fields[k] = b.dataset.chip; app.querySelectorAll("[data-chip]").forEach((x) => x.setAttribute("aria-pressed", x === b)); setTimeout(next, 180); return; }
  if (b.dataset.step) { const k = steps()[Q.step].slice(2), f = FIELDS[k]; Q.fields[k] = Math.max(f.min, Math.min(f.max, (Q.fields[k] ?? f.def) + Number(b.dataset.step))); b.parentElement.querySelector("b").textContent = Q.fields[k]; persist(); return; }
  if (b.dataset.pref) { readInputs(); Q.contactPref = b.dataset.pref; err = ""; render(); return; }
  if (b.hasAttribute("data-next")) { readInputs(); const v = validate(); if (v) { err = v; render(); return; } next(); return; }
  if (b.hasAttribute("data-back")) { history.back(); return; }
  if (b.dataset.goto !== undefined) { go(Number(b.dataset.goto)); return; }
  if (b.hasAttribute("data-submit")) { submit(b); return; }
  if (b.hasAttribute("data-again")) { Object.assign(Q, blank(), { name: Q.name, email: Q.email, phone: Q.phone }); vendors = []; history.replaceState({ step: 0 }, "", location.pathname); render(); return; }
  if (b.hasAttribute("data-home")) { e.preventDefault(); if (!Q.done) { Q.step = 0; history.replaceState({ step: 0 }, "", location.pathname); render(); } return; }
});
app.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input")) { e.preventDefault(); const n = app.querySelector("[data-next]"); if (n) n.click(); } });

/* language sheet */
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-lang-open]")) {
    layer.innerHTML = `<div class="scrim" data-close><div class="sheet pad" role="dialog" aria-modal="true" aria-labelledby="lg-t"><div class="grab"></div><h2 id="lg-t" style="font-size:19px">${esc(t("language"))}</h2>
      <div class="langlist">${LANGS.map((l) => `<button type="button" class="ans plain" data-lang="${l}" aria-pressed="${l === lang}"><span class="tx"><b>${esc(NAMES[l].lang_name)}</b></span><span class="radio"></span></button>`).join("")}</div></div></div>`;
    return;
  }
  const lb = e.target.closest("[data-lang]");
  if (lb) { lang = lb.dataset.lang; store.set("maree-lang", lang); t = makeT(lang); document.documentElement.lang = lang; layer.innerHTML = ""; render(); loadCatalogLang(); return; }
  if (e.target.matches("[data-close]")) layer.innerHTML = "";
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") layer.innerHTML = ""; });

history.replaceState({ step: Q.step }, "", Q.step ? "#s-" + Q.step : location.pathname);
(async () => { if (Q.optionId) await loadVendors(); render(); loadCatalogLang(); })();
})();
</script>
</body>
</html>
